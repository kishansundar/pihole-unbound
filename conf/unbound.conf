server:
    # General options
    interface: 127.0.0.1@5353
    # IPv6 interface commented by default - uncomment if needed
    #interface: ::1@5353
    # Access control - consolidated entries
    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::0/0 refuse
    # Performance tuning for 1GB Pi 4 with Pi-hole
    num-threads: 2  # Increased to 2 threads for better Pi-hole integration
    outgoing-range: 32  # Increased for better performance with Pi-hole
    num-queries-per-thread: 512  # Increased for better performance
    so-reuseport: yes  # Re-enabled for multiple threads
    jostle-timeout: 200  # Relaxed for better performance
    # Process settings
    do-daemonize: no
    username: unbound
    directory: /etc/unbound
    chroot: /etc/unbound
    pidfile: /run/unbound.pid
    use-syslog: yes
    # Memory optimization for Pi 4 (1GB model with Pi-hole)
    msg-cache-size: 16m  # Increased for better Pi-hole integration
    rrset-cache-size: 32m  # Increased for better Pi-hole integration
    key-cache-size: 8m  # Maintained for DNSSEC
    neg-cache-size: 2m  # Increased for better handling of ad domains
    infra-cache-numhosts: 1000  # Increased for better performance
    # Buffer sizes highly optimized for 1GB Pi
    so-rcvbuf: 128k  # Minimal buffer for 1GB Pi
    so-sndbuf: 128k  # Minimal buffer for 1GB Pi
    edns-buffer-size: 1232
    max-udp-size: 1232  # Aligned with edns-buffer-size
    # Cache optimization
    prefetch: yes
    prefetch-key: yes
    cache-min-ttl: 300  # Reduced from 3600 to refresh more frequently
    cache-max-ttl: 86400
    cache-max-negative-ttl: 60
    serve-expired: yes
    serve-expired-ttl: 0  # Serve expired data only while fetching
    serve-expired-client-timeout: 1800  # 30 minutes timeout
    # Query optimization
    qname-minimisation: yes
    minimal-responses: yes
    rrset-roundrobin: yes
    # Security options
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: yes
    unwanted-reply-threshold: 10000000
    # DNS options
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    # Files
    auto-trust-anchor-file: "root.key"
    root-hints: "root.hints"
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
    tls-system-cert: yes
    # Private addresses
    private-address: 192.168.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fc00::/7
    private-address: 2401:4900::/32

# Remote control
remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    server-key-file: "/etc/unbound/unbound_server.key"
    server-cert-file: "/etc/unbound/unbound_server.pem"
    control-key-file: "/etc/unbound/unbound_control.key"
    control-cert-file: "/etc/unbound/unbound_control.pem"

# Forward zone configuration - uncommented for better performance
forward-zone:
    name: "."
    forward-first: yes
    forward-tls-upstream: yes

    # Cloudflare DNS over TLS (pick one primary set based on your location/preference)
    #forward-addr: 1.1.1.1@853#cloudflare-dns.com
    #forward-addr: 1.0.0.1@853#cloudflare-dns.com
    #forward-addr: 2606:4700:4700::1111@853#cloudflare-dns.com
    #forward-addr: 2606:4700:4700::1001@853#cloudflare-dns.com

    # Quad9 DNS over TLS
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
    forward-addr: 2620:fe::fe@853#dns.quad9.net
    forward-addr: 2620:fe::9@853#dns.quad9.net
